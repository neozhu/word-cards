services:
  word-cards:
    image: ghcr.io/neozhu/word-cards:latest
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TTS_API_URL: ${TTS_API_URL:-http://host.docker.internal:48731}
      TTS_API_KEY: ${TTS_API_KEY:-}
      SPEAK_APP_ID: ${SPEAK_APP_ID:-}
      SPEAK_APP_SECRET: ${SPEAK_APP_SECRET:-}
      SPEAK_LOCAL_CLIENT_IP: ${SPEAK_LOCAL_CLIENT_IP:-}
    restart: unless-stopped
